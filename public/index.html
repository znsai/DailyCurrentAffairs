<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Current Affairs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f6f7f9;
      color: #1a202c;
      line-height: 1.6;
    }
    header {
      background: #1a365d;
      color: #fff;
      padding: 1.25rem 1rem;
      text-align: center;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p { font-size: 0.85rem; opacity: 0.85; }
    main { max-width: 720px; margin: 0 auto; padding: 1rem; }
    .status {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 1.25rem;
      margin-top: 1rem;
      text-align: center;
    }
    .status code { background: #edf2f7; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.85rem; }
    footer { text-align: center; font-size: 0.8rem; color: #718096; padding: 2rem 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>Daily Current Affairs</h1>
    <p>For Indian competitive &amp; government exam preparation</p>
  </header>
  <main>
    <div class="status">
      <p><strong>Site under construction.</strong></p>
      <p style="margin-top:0.5rem">API is live at <code>/api/health</code> — the article feed will appear here in a later phase.</p>
    </div>
  </main>
  <footer>Daily Current Affairs &middot; Built for students</footer>
</body>
</html>
